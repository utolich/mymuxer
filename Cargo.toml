[package]
name = "mymuxer"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0.100"
bytes = "1.11.0"
futures = "0.3.31"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
reqwest = {  version = "0.12.24", features = ["stream", "json", "hickory-dns"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["full"] }
axum = "0.8.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "chrono"] }
ipnet = "2.11.0"
socket2 = "0.6.1"
tokio-util = "0.7.17"
scopeguard = "1.2.0"
crc = "3.4.0"
tracing-appender = "0.2.4"
chrono = { version = "0.4.42", features = ["serde"] }
strum = { version = "0.28.0", features = ["derive"] }
encoding_rs = "0.8.35"
url = "2.5.7"
m3u8-rs = "6.0.0"
libc = "0.2.177"
rand = "0.9.2"
chrono-tz = "0.10.4"

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = "0.7.0"
tikv-jemalloc-ctl = {  version = "0.7.0", features = ["stats", "use_std"] }

[features]
dvbcsa = []

[build-dependencies]
pkg-config = "0.3"
